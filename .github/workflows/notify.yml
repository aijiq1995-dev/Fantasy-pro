name: notify
# يشغّل محرك الإشعارات كل 5 دقايق (GitHub ممكن يأخره شوية بأوقات الزحمة)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run notifier
        run: curl -sS --max-time 70 https://fantasy-pro-aijo0.vercel.app/api/notify; echo
