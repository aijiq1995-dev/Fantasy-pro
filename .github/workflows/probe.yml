name: probe
on: { push: { paths: ['.github/workflows/probe.yml'] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://fantasy-pro-aijo0.vercel.app
          curl -s "$B/api/fpl?path=entry/5315212/" > e.json; python3 -c "import json;d=json.load(open('e.json'));print([(l['id'],l['name']) for l in d['leagues']['classic']][:12]);print([(l['id'],l['name']) for l in d['leagues']['h2h']])"
          IDS=$(python3 -c "import json;d=json.load(open('e.json'));print(' '.join(str(l['id']) for l in d['leagues']['classic'] if l.get('league_type')=='x')+' '+' '.join('h'+str(l['id']) for l in d['leagues']['h2h']))")
          echo "IDS $IDS"
          for i in $IDS; do if [[ $i == h* ]]; then id=${i#h}; s=h2h; p=leagues-h2h; else id=$i; s=league; p=leagues-classic; fi
            echo "== $i"; curl -s -w " [%{http_code}]\n" "$B/api/fpl?path=$p/$id/standings/" | head -c 200; echo
            curl -s -w " [%{http_code}]\n" "$B/api/captains?gw=10&src=$s&id=$id&fin=1" | head -c 300; echo
            curl -s -o /dev/null -w "direct-gh %{http_code}\n" -A "Mozilla/5.0 (compatible; FantasyPro/2.0)" "https://fantasy.premierleague.com/api/$p/$id/standings/"
          done
          curl -s "$B/api/fpl?status=1" | head -c 1500
