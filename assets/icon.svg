<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="85%">
      <stop offset="0" stop-color="#174A39"/>
      <stop offset=".45" stop-color="#0E2420"/>
      <stop offset="1" stop-color="#090C13"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF5C4"/>
      <stop offset=".55" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0FA877"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- خطوط ملعب خفيفة -->
  <g fill="none" stroke="#7CF5C4" stroke-opacity=".10" stroke-width="10">
    <circle cx="512" cy="1024" r="300"/>
    <line x1="0" y1="1024" x2="1024" y2="1024"/>
    <rect x="312" y="-40" width="400" height="190" rx="8"/>
  </g>
  <!-- حلقة -->
  <circle cx="512" cy="530" r="330" fill="none" stroke="url(#mint)" stroke-opacity=".22" stroke-width="14"/>
  <!-- حرف F -->
  <g filter="url(#soft)">
    <path d="M392 300 H676 Q700 300 700 324 V372 Q700 396 676 396 H494 V478 H636 Q660 478 660 502 V546 Q660 570 636 570 H494 V720 Q494 744 470 744 H416 Q392 744 392 720 Z" fill="url(#mint)"/>
  </g>
  <!-- نجمة ذهبية -->
  <g filter="url(#glow)" transform="translate(742 268)">
    <path d="M0 -86 C10 -26 26 -10 86 0 C26 10 10 26 0 86 C-10 26 -26 10 -86 0 C-26 -10 -10 -26 0 -86 Z" fill="url(#gold)"/>
  </g>
</svg>
